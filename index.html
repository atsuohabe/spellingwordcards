<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3aa0ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Word Cards">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=2026-11-07a">
<title>Word Cards</title>
</head>
<body>

<button id="update-bar" class="update-bar" hidden>🔄 New version — tap to update</button>

<!-- ========== ホーム ========== -->
<section id="view-home" class="view is-active">
  <h1 class="app-title">📚 Word Cards</h1>

  <div id="resume-box" class="resume" hidden>
    <p class="resume-label">Last time</p>
    <p id="resume-info" class="resume-info"></p>
    <button id="resume-btn" class="btn btn-primary">▶️ Keep going</button>
  </div>

  <h2 class="section-title">1. Pick a list</h2>
  <div id="sheet-list" class="sheet-list">
    <p class="loading">Loading…</p>
  </div>

  <h2 class="section-title">2. Order</h2>
  <div class="mode-row">
    <button class="mode-btn is-on" data-mode="order">🔢 In order</button>
    <button class="mode-btn" data-mode="random">🎲 Shuffle</button>
  </div>

  <button id="start-btn" class="btn btn-primary btn-start" disabled>Start 🚀</button>
  <p id="home-error" class="error" hidden></p>

  <button id="scan-open-btn" class="btn btn-sub btn-scan">📷 Add from photo</button>

  <div class="settings">
    <p class="settings-label">🗣 Voice</p>
    <select id="voice-select" class="voice-select" aria-label="Choose a voice"></select>

    <p class="settings-label">🔊 Speed</p>
    <div id="speed-row" class="speed-row">
      <button class="speed-btn" data-rate="0.25">🐢 0.25×</button>
      <button class="speed-btn" data-rate="0.45">0.45×</button>
      <button class="speed-btn" data-rate="0.7">0.7×</button>
      <button class="speed-btn" data-rate="1">🐇 1×</button>
    </div>
    <p id="voice-info" class="voice-info"></p>
  </div>
</section>

<!-- ========== 単語一覧 ========== -->
<section id="view-list" class="view">
  <header class="topbar">
    <button id="list-back-btn" class="btn-plain">← Back</button>
    <span id="list-title" class="topbar-title"></span>
    <span id="list-count" class="progress"></span>
  </header>
  <div id="word-list" class="word-list"></div>
</section>

<!-- ========== 写真から追加 ========== -->
<section id="view-scan" class="view">
  <header class="topbar">
    <button id="scan-back-btn" class="btn-plain">← Back</button>
    <span class="topbar-title">📷 写真から追加</span>
  </header>

  <details id="scan-keys" class="scan-keys">
    <summary>⚙️ 設定 <span id="scan-keys-status" class="scan-keys-status"></span></summary>
    <label class="scan-label" for="scan-anthropic-key">Claude の API キー（写真の読み取り・翻訳）</label>
    <input id="scan-anthropic-key" class="scan-input" type="password" autocomplete="off" placeholder="sk-ant-...">
    <label class="scan-label" for="scan-github-token">GitHub のトークン（マスタへの登録）</label>
    <input id="scan-github-token" class="scan-input" type="password" autocomplete="off" placeholder="github_pat_...">
    <p class="scan-note">キーはこの端末のブラウザにだけ保存されます。くわしくは README の「写真から単語カードを作る」を見てください。</p>
    <button id="scan-save-keys" class="btn btn-primary btn-small">保存</button>
  </details>

  <div id="scan-step-photo">
    <p class="scan-lead">単語カードのプリントを撮った写真を選んでください。</p>
    <input id="scan-file" type="file" accept="image/*" hidden>
    <button id="scan-pick-btn" class="btn btn-sub">🖼 写真を選ぶ / 撮る</button>
    <img id="scan-preview" class="scan-preview" alt="選んだ写真" hidden>
    <button id="scan-read-btn" class="btn btn-primary" disabled>📖 読み取る</button>
  </div>

  <div id="scan-step-review" hidden>
    <p id="scan-title" class="scan-title" hidden></p>
    <label class="scan-label" for="scan-sheet-name">シート名（並び番号）</label>
    <input id="scan-sheet-name" class="scan-input" type="text" autocomplete="off">
    <p class="scan-note">英単語と訳を確認してください。🔄 で訳をつけ直し、文字をタップすると手で直せます。上から順に No.1, 2, 3 … と番号がつきます。</p>
    <div id="scan-rows" class="scan-rows"></div>
    <button id="scan-add-btn" class="btn btn-sub">＋ 単語を追加</button>
    <button id="scan-save-btn" class="btn btn-primary">✅ 登録する</button>
    <button id="scan-retake-btn" class="btn btn-sub">📷 写真を選び直す</button>
  </div>

  <div id="scan-step-done" class="scan-done" hidden>
    <p class="done-emoji">🎉</p>
    <p id="scan-done-text" class="scan-done-text"></p>
    <button id="scan-study-btn" class="btn btn-primary">Start 🚀</button>
    <button id="scan-home-btn" class="btn btn-sub">🏠 Home</button>
  </div>

  <p id="scan-status" class="scan-status" hidden></p>
  <p id="scan-error" class="error" hidden></p>
</section>

<!-- ========== 学習 ========== -->
<section id="view-study" class="view">
  <header class="topbar">
    <button id="quit-btn" class="btn-plain">← Stop</button>
    <span id="sheet-name" class="topbar-title"></span>
    <span id="progress" class="progress">0 / 0</span>
  </header>
  <div class="progress-bar"><div id="progress-fill"></div></div>

  <div class="card-area">
    <div id="card" class="card">
      <div class="card-face card-front">
        <button id="speak-btn" class="speak-btn" aria-label="Play the word">🔊</button>
        <p class="card-hint">Tap to listen</p>
      </div>
      <div class="card-face card-back">
        <button id="speak-btn-back" class="speak-mini" aria-label="Play the word">🔊</button>
        <p id="card-word" class="card-word"></p>
        <p id="card-ja" class="card-ja"></p>
      </div>
    </div>
  </div>

  <div class="action-area">
    <button id="flip-btn" class="btn btn-flip">Flip it 🔄</button>
    <div id="answer-row" class="answer-row" hidden>
      <button id="no-btn" class="btn btn-no">🔁 Not yet</button>
      <button id="yes-btn" class="btn btn-yes">⭕️ I know it</button>
    </div>
  </div>
</section>

<!-- ========== おわり ========== -->
<section id="view-done" class="view">
  <div class="done-box">
    <p class="done-emoji">🎉</p>
    <p class="done-text">You know them all!</p>
    <p id="done-detail" class="done-detail"></p>
    <button id="again-btn" class="btn btn-primary">🔁 Again</button>
    <button id="home-btn" class="btn btn-sub">🏠 Home</button>
  </div>
</section>

<script type="module" src="js/app.js?v=2026-11-07a"></script>
</body>
</html>
